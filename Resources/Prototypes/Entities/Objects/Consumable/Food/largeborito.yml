- type: entity
  parent: BaseItem
  id: FoodSnackLargeBorito
  name: large borito packet
  description: Like a normal borito, but bigger!
  components:
  - type: Item
    size: Small
    heldPrefix: large borito
  - type: Sprite
    sprite: Objects/Consumable/Food/largeborito.rsi
    state: largeborito
  - type: SpawnItemsOnUse
    items:
      - id: FoodPacketLargeBoritoTrash
      - id: FoodSnackLargeBoritoOpen
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: FoodBase
  id: FoodSnackLargeBoritoOpen
  name: large borito
  description: Like a normal borito, but bigger!
  components:
    - type: FlavorProfile
      flavors:
        - boritos
    - type: Tag
      tags:
        - FoodSnack
    - type: Solution
      solution:
        reagents:
        - ReagentId: Nutriment
          Quantity: 15
    - type: Item
      size: Small
      heldPrefix: largeborito-open
    - type: Sprite
      sprite: Objects/Consumable/Food/largeborito.rsi
      state: largeborito-open
    - type: Extractable
      grindableSolutionName: food

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseItem
  id: FoodPacketLargeBoritoTrash
  name: large borito wrapper
  description: Like a normal empty packet but bigger!
  components:
  - type: Tag
    tags:
    - Trash
  - type: Sprite
    sprite: Objects/Consumable/Food/largeborito.rsi
    state: largeborito-wrapper